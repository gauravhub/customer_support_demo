[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer support automation agent using LangGraph and Amazon Bedrock"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-aws>=1.0.0",
    "langgraph-checkpoint-aws>=1.0.0",
    "langgraph-cli[inmem]>=0.4.4",
    "langchain-mcp-adapters>=0.2.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.39.0",
    "cognitojwt>=1.4.1",
    "langgraph-sdk>=0.1.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "services"]

[tool.setuptools.package-dir]
"agent" = "src/agent"
"services" = "src/services"

[tool.setuptools.package-data]
"*" = ["*.json", "*.db"]
